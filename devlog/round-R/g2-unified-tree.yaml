schema: unified_category_tree.v1
authoritative_mart: lottemart
authoritative_reason: emart recon decision was sparse (1 fixture categories); lottemart has richest harvested tree (320 fixture categories).
source_inventory:
  counts:
    emart:
      db_distinct: 1
      fixture_distinct: 1
      source_native_values: 1
    homeplus:
      db_distinct: 3
      fixture_distinct: 54
      source_native_values: 1
    lottemart:
      db_distinct: 5
      fixture_distinct: 320
      source_native_values: 324
    costco:
      db_distinct: 2
      fixture_distinct: 4
      source_native_values: 4
  recon_top_categories:
    emart:
    - 사용자 지적대로 **"새벽배송" / "주간배송" / "트레이더스"** 등 여러 자체상품 하위 라벨이 같은 `cdtl_ico_item` 클래스로 등장 — 화이트리스트로 잘라내면 누락 위험.
    - 메인 페이지 nav `a[href*="dispCtgId"]` 14개가 1차 분류(과일·채소·...·건강식품).
    - 카테고리 페이지에서 하위 카테고리 nav도 같은 패턴 — 재귀 크롤로 트리 추출 가능.
    homeplus:
    - 최상위 카테고리는 메인 페이지 nav에서 `categoryId=1~27`로 일관된 ID. 31개 정도.
    - 하위 카테고리도 같은 `/list` 패턴 + `categoryDepth` 증가.
    - 사이드바에 하위 카테고리/필터가 모두 노출되므로 트리 스크레이프 단순.
    lottemart:
    - 메인 nav에 최상위 카테고리 25+개 노출. `__INITIAL_STATE__.data` 안에 카테고리 트리 들어있을 가능성 높음.
    - '존재 확인. 최상위 키: `data, session, control, router, retailerSettings, cookieConsent`.'
    costco:
    - '카테고리: `/c/cos_<숫자.숫자.숫자>` — 점 구분 계층 코드. 예: `cos_10` = 식품, `cos_10.1` = 쌀/잡곡, `cos_1.5.3` = All Mac.'
    - '## 카테고리 트리 — 식품군'
    - '식품 최상위: `cos_10`'
    - '하위 일부: `cos_10.1` 쌀/잡곡 등 — G1에서 풀 트리 수집.'
