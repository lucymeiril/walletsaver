name: pass45 temporary remaining proposal completion

on:
  push:
    branches:
      - cleanup/remove-legacy-ai-admin-coupling
    paths:
      - tools/pass45_complete_remaining.py
      - .github/workflows/pass45-autoproposal.yml

permissions:
  contents: write

jobs:
  complete-pass45-proposals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate proposal-only coverage
        run: python tools/pass45_complete_remaining.py --baseline "$GITHUB_SHA"

      - name: Commit proposal result first, then handoff status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add handoff/2026-09-14-pass45/proposals/complete-remaining-001-451.json
          git commit -m "chore(catalog): propose all remaining pass45 records"

          git add handoff/2026-09-14-pass45/CURRENT_STATUS.md
          git commit -m "docs(handoff): mark pass45 proposal queue complete"

          git push origin HEAD:cleanup/remove-legacy-ai-admin-coupling
