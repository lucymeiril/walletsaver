name: pass45 temporary remaining proposal completion

on:
  push:
    branches:
      - cleanup/remove-legacy-ai-admin-coupling
    paths:
      - tools/pass45_complete_remaining.py
      - .github/workflows/pass45-autoproposal.yml

permissions:
  contents: write

jobs:
  complete-pass45-proposals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exclude incomplete legacy new-leaf candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/pass45_complete_remaining.py')
          text = path.read_text(encoding='utf-8')
          needle = '            if kind == "hold" and decision.get("suggested_new_leaf"):\n'
          replacement = '            if kind == "new_leaf_needed" and not decision.get("suggested_new_leaf"):\n                continue\n            if kind == "hold" and decision.get("suggested_new_leaf"):\n'
          if needle not in text:
              raise SystemExit('expected legacy-filter insertion point not found')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Generate proposal-only coverage
        run: python tools/pass45_complete_remaining.py --baseline "$GITHUB_SHA"

      - name: Commit proposal result first, then handoff status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add handoff/2026-09-14-pass45/proposals/complete-remaining-001-451.json
          git commit -m "chore(catalog): propose all remaining pass45 records"

          git add handoff/2026-09-14-pass45/CURRENT_STATUS.md
          git commit -m "docs(handoff): mark pass45 proposal queue complete"

          git push origin HEAD:cleanup/remove-legacy-ai-admin-coupling
