version: "3.9"

services:
  db:
    image: postgres:16
    container_name: walletsavior-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-walletsavior}
      POSTGRES_USER: ${POSTGRES_USER:-walletsavior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - walletSavior-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-walletsavior}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: walletsavior-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - walletSavior-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./proj
      dockerfile: Dockerfile
    container_name: walletsavior-api
    restart: unless-stopped
    env_file:
      - ./proj/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-walletsavior}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-walletsavior}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - walletSavior-network

  frontend:
    build:
      context: ./proj/frontend-react
      dockerfile: Dockerfile
    container_name: walletsavior-frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - walletSavior-network

  nginx:
    image: nginx:alpine
    container_name: walletsavior-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - walletSavior-network

networks:
  walletSavior-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
