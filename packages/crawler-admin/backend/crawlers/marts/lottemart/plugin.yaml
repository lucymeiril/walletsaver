name: lottemart
display_name: 롯데마트
category: mart
source_group: mart
version: 1.0.0
description: 롯데마트 전단지 및 할인 행사 상품 정보 수집
live_ready: false
parser_contract: lottemart_initial_state_fixture.v1
live_readiness:
  status: blocked_by_source_waf_http_202
  fixture_contract_status: passed
  bounded_diagnostics:
    status: blocked
    run_limits:
      max_requests: 3
      max_pages: 1
      timeout_seconds: 20
    last_no_db_result:
      artifact: .walletsavior-live-validation\lottemart-waf-202-resolution\after-r3-final\live-validation-v2-20260516-131244-94bfd81f.json
      source_raw: 0
      parsed_valid: 0
      records: 0
      blocker: aws_waf_http_202
    prior_partial_result:
      source_raw: 100
      parsed_valid: 50
      records: 50
      blocker: aws_waf_http_202_after_partial_collection
  operator_approval:
    status: required_before_live_ready
  safe_source_paths:
    public_browser_context: allowed_with_human_intervention_no_bypass
    saved_html_json_import: allowed_no_network_no_db
    prohibited: captcha_solving_waf_bypass_credential_abuse
notes: "Do not claim 200+ live readiness while bounded no-DB diagnostics report AWS WAF HTTP 202; use saved-source replay artifacts for parser/AI handoff checks."
target:
  url: https://www.lottemart.com
  difficulty: 3
  strategy: cloudscraper
schedule:
  cron: "0 7 * * *"
  retry_count: 3
  retry_delay: 300
output:
  model: DiscountItem
  required_fields: [name, sale_price, detail_url]
  diagnostic_evidence_fields: [source_raw, parsed, valid, detail_url, source_url, image_url, period, unit, category_hint]
source_map:
  request_strategy: public_search_initial_state_then_ordinary_browser
  search_queries: [할인, 특가, 과일, 채소, 정육, 세일, 우유, 음료]
  category_queries: [과일, 채소, 정육, 계란, 생수, 유제품, 간편식]
  max_pages: 2
  max_requests:
  max_items: 300
  dedupe_key: source_record_key_then_source_url
  parser_inputs: [window.__INITIAL_STATE__, embedded_json, product_card_html]
