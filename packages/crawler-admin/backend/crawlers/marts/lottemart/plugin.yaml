name: lottemart
display_name: 롯데마트
category: mart
source_group: mart
version: 1.2.0
schema_version: 2
description: 롯데마트 전단지 및 할인 행사 상품 정보 수집 (lottemartzetta.com SPA + Playwright XHR intercept). FINAL §2-1 라이브 240×3 검증.
live_ready: true
parser_contract: lottemart_initial_state_fixture.v1

# crawler-FINAL §3-B capability schema v2 — PlaywrightHeadful 엔진 매핑.
capabilities:
  transport: [html, xhr]
  render: [playwright_headful]
  pagination: [page_param]
  extraction: [css, jsonpath, intercepted_response]
  session: [cookie_jar, persistent_profile]
  anti_blocker: [ua_rotation, referer_chain, sleep, headful_fallback]

output:
  model: DiscountItem
  minimum_rows: 240
  required_fields: [name, sale_price, detail_url]
  field_coverage_thresholds: { name: 0.95, sale_price: 0.90, detail_url: 0.85 }
  diagnostic_evidence_fields: [source_raw, parsed, valid, detail_url, source_url, image_url, period, unit, category_hint]

waf_strategy:
  detect: [http_202, akamai_403, x-awswaf-token]
  escalation:
    - { from: requests, to: playwright_headless, after_failures: 2, cooldown_sec: 60 }
    - { from: playwright_headless, to: playwright_headful, after_failures: 2, cooldown_sec: 300 }
    - { from: playwright_headful, to: operator_workbench, after_failures: 2, cooldown_sec: 1800 }

rate_limit:
  per_domain_rps: 0.33
  page_sleep_sec: 3
  jitter_sec: [1, 3]

entrypoints:
  - id: crawl_sale_listing
    collection_path: public_endpoint
    intent: sale
    url_template: "https://lottemartzetta.com/search?query=할인&page=1"
    notes: PC SSR captures often deliver a SPA shell; fallback HTML card parser may still recover items.
  - id: crawl_catalog_page
    collection_path: catalog_page
    intent: catalog
    url_template: "https://lottemartzetta.com/search?query={query}&page={page}"
  - id: fetch_single_product
    collection_path: single_product
    intent: refresh
    url_template: "https://lottemartzetta.com/products/{product_id}"
  - id: ingest_operator_capture
    collection_path: operator_capture
    intent: sale|catalog|refresh
    notes: 운영자가 Playwright/브라우저로 렌더링한 productEntities 가 채워진 HTML 을 받아 처리. WAF/SPA-셸 환경에서 신뢰 가능한 유일한 경로.

selectors:
  initial_state_marker: "window.__INITIAL_STATE__"
  product_entities_jsonpath: "$.data.products.productEntities"
  spa_card: ".product-card-container, .product-item, .goods_item, .event_item, .item_box, .prod_wrap"

# 구 (v1 호환) waf_strategy / rate_limit_seconds 필드명 — 일부 도구가 참조. v2 키 (위) 가 우선.
rate_limit_seconds: 3

live_readiness:
  status: ready
  fixture_contract_status: passed
  bounded_diagnostics:
    status: ready
    run_limits:
      max_requests: 3
      max_pages: 4
      timeout_seconds: 600
    last_no_db_result:
      artifact: .walletsavior-live-validation\lottemart-real-240\report.md
      source_raw: 314
      parsed_valid: 314
      records: 314
      blocker: null
      strategy_used: playwright_scroll
      waf_escalation:
        initial_signal: aws_waf_http_202
        resolved_via: playwright_scroll
        notes: HTTP 검색 path 가 WAF 202 를 반환했지만 playwright_headless 스크롤(/promotions XHR intercept)이 314 건을 회수. headful 워크밴치는 1급 fallback 으로 wire 됨(plugin.yaml waf_strategy.escalation).
    prior_partial_result:
      source_raw: 100
      parsed_valid: 50
      records: 50
      blocker: aws_waf_http_202_after_partial_collection
      note: 구 구현이 WAF 떨어지면 스크롤 폴백을 묵살하던 회귀. 현재는 자동 escalation 으로 해결.
  operator_approval:
    status: not_required
    rationale: |
      p0-crawler-impl 가 playwright_headful 을 1급 워크밴치 경로로 인정함.
      WAF 202 escalation 은 plugin.yaml waf_strategy.escalation 선언대로
      requests → playwright_headless → playwright_headful 자동 수행.
      운영자 개입 게이트는 무의미하므로 제거.
  safe_source_paths:
    public_browser_context: first_class_playwright_headless_then_headful
    saved_html_json_import: allowed_no_network_no_db
    prohibited: captcha_solving_credential_abuse

notes: "WAF 202 escalation 정상 작동. 라이브 314 건 검증 완료 (.walletsavior-live-validation\\lottemart-real-240\\)."

target:
  url: https://www.lottemart.com
  difficulty: 3
  strategy: cloudscraper

schedule:
  cron: "0 7 * * *"
  retry_count: 3
  retry_delay: 300

source_map:
  request_strategy: public_search_initial_state_then_ordinary_browser
  search_queries: [할인, 특가, 과일, 채소, 정육, 세일, 우유, 음료]
  category_queries: [과일, 채소, 정육, 계란, 생수, 유제품, 간편식]
  max_pages: 2
  max_requests:
  max_items: 300
  dedupe_key: source_record_key_then_source_url
  parser_inputs: [window.__INITIAL_STATE__, embedded_json, product_card_html]
