name: emart
display_name: 이마트
category: mart
version: 1.0.0
description: 이마트 전단지 및 할인 행사 상품 정보 수집
live_ready: false
parser_contract: emart_next_data_fixture.v1
live_readiness:
  status: source_collection_diagnostics_required
  fixture_contract_status: passed
  bounded_diagnostics:
    status: required_before_live_ready
    run_limits:
      max_requests: 3
      max_pages: 1
      timeout_seconds: 20
  operator_approval:
    status: required_before_live_ready
notes: "Do not claim live-service readiness until source collection diagnostics pass a bounded operator-approved run."
target:
  url: https://emart.ssg.com
  difficulty: 3
  strategy: cloudscraper
schedule:
  cron: "0 7 * * *"
  retry_count: 3
  retry_delay: 300
output:
  model: DiscountItem
  required_fields: [name, sale_price, detail_url]
  diagnostic_evidence_fields: [source_raw, parsed, valid, detail_url, source_url, image_url, period, unit, category_hint]
source_map:
  request_strategy: public_search_next_data
  search_queries: [행사, 할인, 특가, "1+1", 반값, 세일]
  category_queries: [과일, 채소, 정육, 수산, 유제품, 생수, 간편식]
  max_pages: 3
  max_requests:
  max_items:
  dedupe_key: source_record_key_then_source_url
  parser_inputs: [__NEXT_DATA__, embedded_json, product_card_html]
