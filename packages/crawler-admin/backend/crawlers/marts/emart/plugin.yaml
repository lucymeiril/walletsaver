name: emart
display_name: 이마트
category: mart
version: 3.0.0
description: 이마트 카테고리 CSR 상품 카드 수집 (raw HTML selector 기반)
live_ready: false
parser_contract: emart_category_card_html.g1
entrypoints:
  module: crawlers.marts.emart.entrypoints
  class: EmartEntrypoints
  paths:
    - name: crawl_sale_listing
      collection_path: public_endpoint
      crawl_intent: sale
      live_url_template: "https://emart.ssg.com/disp/category.ssg?dispCtgId=6000095494"
    - name: crawl_catalog_page
      collection_path: catalog_page
      crawl_intent: catalog
      args: [category_or_query, page]
    - name: fetch_single_product
      collection_path: single_product
      crawl_intent: refresh
      args: [url_or_id]
    - name: ingest_operator_capture
      collection_path: operator_capture
      crawl_intent: any
      args: [html, source_url, capture_id]
rate_limit_seconds:
  between_live_gets: 3
  between_catalog_pages: 5
  between_search_queries: 5
live_readiness:
  status: source_collection_diagnostics_required
  fixture_contract_status: passed
  bounded_diagnostics:
    status: required_before_live_ready
    run_limits:
      max_requests: 3
      max_pages: 1
      timeout_seconds: 15
  operator_approval:
    status: required_before_live_ready
notes: "Round R G1: 카테고리 페이지 CSR 렌더 후 a[href*='itemView.ssg'] 상품 카드에서 itemId/siteNo/salestrNo를 추출한다."
target:
  url: https://emart.ssg.com
  difficulty: 3
  strategy: requests
schedule:
  cron: "0 7 * * *"
  retry_count: 3
  retry_delay: 300
output:
  model: DiscountItem
  minimum_rows: 270
  required_fields: [name, sale_price, detail_url]
  field_coverage_thresholds: { name: 0.95, sale_price: 0.90, detail_url: 0.85 }
  diagnostic_evidence_fields: [source_raw, parsed, valid, detail_url, source_url, image_url, period, unit, category_hint, collection_path, crawl_intent, source_record_key]
source_map:
  request_strategy: category_csr_rendered_html
  search_queries: []
  category_queries: [과일/채소, 정육/계란, 수산/건어물, 쌀/잡곡, 우유/유제품]
  max_pages: 5
  max_requests:
  max_items:
  dedupe_key: mart_native_code
  parser_inputs: [product_card_html]
  selectors:
    product_link: "a[href*='itemView.ssg']"
    delivery_badge: ".cdtl_ico_item"
    name: ".mnemitem_goods_tit, .cunit_md, img[alt]"
    sale_price: ".new_price .ssg_price, .ssg_price"
    original_price: ".old_price .ssg_price, del, s"
    image_url: "img[src], img[data-src]"
    unit_price: "text matching UNIT_PRICE_RE"

