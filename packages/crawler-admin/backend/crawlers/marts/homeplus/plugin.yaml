name: homeplus
display_name: 홈플러스
category: mart
version: 1.1.0
description: 홈플러스 전단지 및 할인 행사 상품 정보 수집 (mfront search API 우선, SPA HTML 폴백)
live_ready: false
parser_contract: homeplus_mfront_fixture.v1
entrypoints:
  - id: crawl_sale_listing
    collection_path: public_endpoint
    intent: sale
    url_template: "https://mfront.homeplus.co.kr/search?keyword=할인&page=1"
    payload: json_envelope_returnstatus200_data_dataList
  - id: crawl_catalog_page
    collection_path: catalog_page
    intent: catalog
    url_template: "https://mfront.homeplus.co.kr/search?keyword={query}&page={page}"
  - id: fetch_single_product
    collection_path: single_product
    intent: refresh
    url_template: "https://mfront.homeplus.co.kr/item?itemNo={item_no}&storeType=HYPER"
  - id: ingest_operator_capture
    collection_path: operator_capture
    intent: sale|catalog|refresh
selectors:
  api_envelope_root: "$.returnStatus==200 && $.data.dataList[*]"
  api_keys:
    name: itemNm
    sale_price: dcPrice|salePrice|singlePrice
    original_price: salePrice (when dcPrice present)
    item_no: itemNo
    doc_id: docId
    unit_price: unitPrice
    category: scateNm|mcateNm|lcateNm|rcateNm
    event_name: eventInfo.eventBtnText
  spa_card: ".unitItemInner, .product-item, .goods_item, .event_item, .item_box, .prod_wrap"
rate_limit_seconds: 3
live_readiness:
  status: bounded_fixture_ready_live_disabled
  fixture_contract_status: passed
  bounded_diagnostics:
    status: fixture_required_before_live_ready
    run_limits:
      max_requests: 1
      max_pages: 1
      timeout_seconds: 20
  operator_approval:
    status: required_before_live_ready
notes: "Homeplus is SPA/browser-dependent. Keep live collection disabled unless a bounded, operator-approved run is requested."
target:
  url: https://www.homeplus.co.kr
  difficulty: 3
  strategy: playwright
schedule:
  cron: "0 7 * * *"
  retry_count: 3
  retry_delay: 300
output:
  model: DiscountItem
  minimum_rows: 435
  required_fields: [name, sale_price, detail_url]
  field_coverage_thresholds: { name: 0.95, sale_price: 0.90, detail_url: 0.85 }
  diagnostic_evidence_fields: [source_raw, parsed, valid, detail_url, source_url, image_url, period, unit, category_hint]
  measurement_basis: "실 live측정 N=544 (2026-05-24, Playwright 23쿼리, cap없음). minimum_rows=floor(N×0.80)=435"
source_map:
  request_strategy: public_search_playwright_spa
  search_queries: [할인, 특가, 세일, "1+1", 행사, 반값, 오늘특가, 홈플런]
  category_queries: [과일, 채소, 정육, 계란, 쌀, 생수, 우유, 유제품, 간편식, 냉동식품, 라면, 과자, 커피, 세제, 화장지]
  max_pages: 1
  max_requests:
  max_items: 653
  measurement_override_env: "HOMEPLUS_MEASUREMENT_MAX_ITEMS (운영 cap 유지하며 측정 실행 가능. '0' 또는 'none'으로 cap 해제)"
  dedupe_key: source_record_key_then_source_url
  parser_inputs: [mfront_unitItemInner_html, embedded_json, legacy_product_card_html]
  live_measurement:
    last_run: "2026-05-24T19:23:30"
    N_real_unique: 544
    queries_attempted: 23
    spa_blocked: 0
    errors: 0
    minimum_rows_formula: "floor(N×0.80) = 435"
    max_items_formula: "ceil(N×1.2) = 653"
    evidence: ".walletsavior-live-validation/homeplus-real-count/live-run-20260524T192330.json"
