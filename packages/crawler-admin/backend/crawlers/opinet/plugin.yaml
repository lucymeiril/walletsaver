name: opinet
display_name: 오피넷 주유소
category: fuel
version: 1.1.0
description: 오피넷 주유소 가격 fixture-only 크롤러 스켈레톤
live_ready: false
parser_contract: opinet_fixture_json.v1
entrypoints:
  module: crawlers.opinet.crawler
  class: OpinetCrawler
  paths:
    - name: crawl_region
      collection_path: fixture_json
      crawl_intent: fuel_price
      args: [sido]
    - name: crawl_from_fixture
      collection_path: fixture_file
      crawl_intent: fuel_price
      args: [fixture_path]
target:
  url: https://www.opinet.co.kr
  strategy: fixture_only
output:
  model: OpinetGasStation + OpinetGasStationPrice
  required_fields: [station_code, brand, name, address, sido, sigungu, prices]
notes: |
  Round R G5-c에서는 라이브 HTTP/API 호출을 금지한다.
  실제 오피넷 API/마크업 정찰 및 head reconcile은 메인 작업에서 수행한다.
