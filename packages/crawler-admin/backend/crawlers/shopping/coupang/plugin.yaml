name: coupang
display_name: 쿠팡
category: shopping
module: crawlers.shopping.coupang.crawler
class_name: CoupangCrawler
schedule: manual
difficulty: skeleton
source_id: coupang
source_group: marketplace
version: 1.1.0
live_ready: false
parser_contract: marketplace_skeleton.v1
fixture_contract: marketplace_skeleton_fixture_contracts.v1
source_contract: marketplace_browser_saved_source.v1
entrypoints:
  - id: crawl_sale_listing
    collection_path: public_endpoint
    intent: sale
    url_template: "https://www.coupang.com/np/search?component=&q=할인특가&traceId={trace_id}&channel=user&page=1"
  - id: crawl_catalog_page
    collection_path: catalog_page
    intent: catalog
    url_template: "https://www.coupang.com/np/search?component=&q={query}&traceId={trace_id}&channel=user&page={page}"
  - id: fetch_single_product
    collection_path: single_product
    intent: refresh
    url_template: "https://www.coupang.com/vp/products/{product_id}"
  - id: ingest_operator_capture
    collection_path: operator_capture
    intent: sale|catalog|refresh
    notes: 운영자가 자신의 브라우저 세션으로 PLP/PDP 를 캡처하여 입력. 본 슬라이스 시점 라이브 자동화는 100% Akamai 차단.
catalog_seeds:
  - 생수 2L
  - 우유 1L
  - 계란 30구
  - 라면 5입
  - 세탁세제 3L
coupang_traceId_note: |
  Phase A 2nd slice (gap-closure attempt): 본 슬라이스에서 traceId 3종을 모두
  단발 비교 진단함 — empty / random 16-hex (예: f7f29239c06540ce) / 고정 16-hex
  (0123456789abcdef). 결과는 tests/fixtures/live_probe/coupang_traceId_diag.json
  참조: 세 variant 모두 HTTP 403 / 387 bytes / "Access Denied" Akamai edgesuite
  응답으로 동일 분류 (akamai_access_denied). 응답 본문 SHA-256 만 미세히 다르며
  이는 Akamai 가 traceId 자체로 분기하지 않는다는 직접 증거. 추가로 Playwright
  persistent-profile (별도 새 user data dir) 및 undetected-chromedriver 시도
  역시 즉시 403. 따라서 본 슬라이스 시점에서 traceId variation 으로는 Akamai
  를 우회할 수 없다는 것이 확정되었고, operator_capture 가 유일한 진본 데이터
  경로다. status: blocked_verified_traceId_does_not_help
allowed_source_artifacts:
  - public_browser_rendered_html
  - user_saved_html
  - user_saved_json
prohibited_automation:
  - captcha_solving
  - authentication_bypass
  - access_control_bypass
  - waf_bypass
recurring_registration:
  cadence: manual_fixture_until_verified
  live_network_default: disabled
  db_mutation_allowed: false
live_readiness:
  status: skeleton_fixture_only
  fixture_contract_status: passed
  bounded_diagnostics:
    status: required_before_live_ready
    evidence_id: null
    captured_at: null
    run_limits:
      max_requests: null
      max_pages: null
      timeout_seconds: null
    last_observed_live_blocker: akamai_access_denied
  operator_approval:
    status: required_before_live_ready
  required_evidence:
    - fixture_contract_passed
    - bounded_live_diagnostics_passed
    - bounded_run_limits_recorded
    - operator_approval_recorded
plugin_aliases: ["coupang"]
notes: "Registered skeleton/fixture-only: safe mocked HTML/JSON parser coverage; live crawling intentionally disabled. Do not set live_ready=true until fixture contract, bounded diagnostics evidence, run limits, and operator approval are recorded. Live attempts during this slice were 100% blocked by Akamai access denied — operator_capture is the only verified data path."


