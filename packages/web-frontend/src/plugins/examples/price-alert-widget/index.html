<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가격 알림 위젯</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
    }
    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .alert-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .product-name {
      font-size: 14px;
      font-weight: 500;
    }
    .price-info {
      text-align: right;
    }
    .current-price {
      font-size: 14px;
      color: #38bdf8;
      font-weight: 600;
    }
    .target-price {
      font-size: 12px;
      color: #64748b;
    }
    .price-down {
      color: #34d399;
    }
    .price-up {
      color: #f87171;
    }
    .empty {
      text-align: center;
      color: #64748b;
      padding: 32px;
    }
  </style>
</head>
<body>
  <div class="header">🔔 가격 알림</div>
  <div id="alerts" class="alert-list"></div>

  <script>
    // 데모 알림 데이터
    const mockAlerts = [
      { id: 1, name: '삼성 갤럭시 S24', currentPrice: 1089000, targetPrice: 1000000, change: -3.2 },
      { id: 2, name: '에어팟 프로 2', currentPrice: 298000, targetPrice: 280000, change: -5.1 },
      { id: 3, name: 'LG 스탠바이미', currentPrice: 890000, targetPrice: 850000, change: 1.5 },
    ];

    function render(alerts) {
      const container = document.getElementById('alerts');
      if (alerts.length === 0) {
        container.innerHTML = '<div class="empty">설정된 가격 알림이 없습니다</div>';
        return;
      }
      container.innerHTML = alerts.map(a => `
        <div class="alert-item">
          <div class="product-name">${a.name}</div>
          <div class="price-info">
            <div class="current-price">${a.currentPrice.toLocaleString()}원</div>
            <div class="target-price">목표: ${a.targetPrice.toLocaleString()}원</div>
            <div class="${a.change < 0 ? 'price-down' : 'price-up'}">
              ${a.change > 0 ? '▲' : '▼'} ${Math.abs(a.change)}%
            </div>
          </div>
        </div>
      `).join('');
    }

    render(mockAlerts);
  </script>
</body>
</html>
