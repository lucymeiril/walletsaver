# WalletSavior 자동완성 동의어 사전
# 형식: 대표어(키) → [대안 표현 목록]
# 양방향 검색 지원: 대표어로 검색해도, 대안어로 검색해도 관련 결과가 나옴.
# 사람이 편집 가능 — 코드 수정 없이 동의어 추가/변경.
# 시드: 4사 fixture(이마트·홈플러스·롯데마트·코스트코) 20건에서 등장한 한국어 자연 동의어만 포함.

synonyms:

  # 위생용품 (홈플러스 fixture: 잘풀리는집 키친타월)
  키친타월:
    - 키친타올
    - 키친 타월

  # 정육·계란 (롯데마트 fixture: 행복생생란)
  계란:
    - 달걀

  # 두부 (롯데마트 fixture: 풀무원 국산 부침두부)
  두부:
    - 콩두부

  # 화장지 (코스트코 fixture: 크리넥스 메가롤 화장지)
  화장지:
    - 휴지
    - 두루마리

  # 채소 — 과채류 (이마트·롯데마트 fixture: 아삭 파프리카, 국내산 파프리카)
  파프리카:
    - 피망

  # 채소 — 엽채류 (이마트 fixture: 한끼 양배추)
  양배추:
    - 캐비지

  # 곡류 (이마트 fixture: 철원 오대쌀)
  쌀:
    - 백미

  # 과일 (롯데마트 fixture: 제스프리 골드키위)
  키위:
    - 다래

  # 스낵·견과 (홈플러스 fixture: 머거본 믹스파티 프렌즈)
  견과:
    - 견과류
    - 너트

  # 간편식·밀키트 (롯데마트 fixture: CJ 고메 중화짬뽕)
  밀키트:
    - 간편식

  # 뷰티·헬스 — 건강기능식품 (코스트코 fixture: 대웅제약 임팩타뮨)
  비타민:
    - 영양제

  # 뷰티·헬스 — 스킨케어 (코스트코 fixture: 바이오더마 아토덤 울트라 크림)
  크림:
    - 바디크림
    - 손크림

  # 일반 화장품 검색 보조
  화장품:
    - 코스메틱
