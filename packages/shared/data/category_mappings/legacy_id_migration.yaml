# WalletSavior 레거시 카테고리 ID → category_tree.yaml 공식 ID 마이그레이션 규칙
#
# 형식: "old_id": "tree_node_id"
#
# 커버 범위:
#   A. ai-admin/seed_taxonomy.py dot-notation IDs
#   B. classifier.py 결정론적 IDs
#   C. db-admin/category_data/categories.py dot-notation IDs
#   D. 정수 IDs (구 DB 시딩)
#   E. 한글 IDs (raw 크롤 레거시)
#
# 매핑 불가(예: service.voucher, sports.general 등): 이 파일에 포함하지 않음
# → validate_category_id()가 escalation 큐로 전달.
#
# 확장 방법: 이 파일에 새 항목 추가 후 reload_migration_map() 호출 또는 서버 재기동.

mappings:
