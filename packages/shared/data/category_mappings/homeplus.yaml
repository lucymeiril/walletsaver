# 홈플러스 카테고리 매핑
#
# 키 형식: "rcateNm|lcateNm|mcateNm|scateNm"
#   - "|"로 4단계 경로를 연결
#   - 슬래시(/)는 홈플러스 OR 표기 — 여러 카테고리를 하나로 묶어 표시하는 것.
#     예: "제지/위생/뷰티"는 내부적으로 단일 카테고리. 원문 그대로 키에 포함.
#   - dcateNm(5단계)은 키에 포함하지 않음.
#     동일 scateNm 안에서 dcateNm만 다른 경우 같은 internal 노드로 collapse.
#
# 이유: 홈플러스 카테고리 코드(rcateCd 등)도 있으나 이름 기반이 사람이 편집하기 쉬움.
#       코드 기반 매핑은 향후 필요 시 별도 파일로 분리.
#
# 미매핑 raw가 들어오면 변환기는 reason="UNMAPPED_NEW_CATEGORY"를 반환함.
# 새 상품 유입 시 이 파일에만 줄 추가하면 코드 변경 없이 매핑 확장 가능.

mappings:

  # 1) 키친타월
  # fixture: 잘풀리는집 천연펄프 2겹 키친타월 150매*6롤
  "제지/위생/뷰티|제지/위생/뷰티|화장지/키친타월/물티슈|키친타월": kitchen_towel

  # 2) 견과
  # fixture: 머거본 믹스파티 프렌즈 800G(통)
  "견과|견과|믹스넛/하루견과|믹스넛": nut

  # 3) 수입육 (불고기/샤브샤브)
  # fixture: 호주청정우 앞다리 불고기&샤브샤브 600G(팩)
  "정육/계란|정육/계란|수입육|국거리/불고기/다짐/샤브샤브": imported_beef

  # 4) 굴비/조기
  # fixture: 영광 참굴비 행사(1.0kg내외/20마리)
  "수산물/건어물|수산물/건어물|생선|조기/굴비": croaker

  # 5) 양말
  # fixture: 게스남성중목행사로고중목6족양말
  "패션의류/잡화|패션잡화|양말/스타킹|양말": socks

  # ─── 3-item fixture 추가 매핑 ───

  # 6) 냉장치킨/꼬치
  # fixture: simplus 숯불닭꼬치 520G
  "냉장/냉동|냉장/냉동/밀키트|피자/핫도그/치킨|치킨": chilled_chicken

  # 7) 올리브유
  # fixture: simplus 엑스트라버진 올리브유 1L
  "장류/양념/제빵|장류/양념/제빵|식용유/참기름|올리브유": olive_oil

  # 8) 파이/케이크류
  # fixture: 허쉬 크림파이 크림치즈 224G
  "과자/시리얼|과자/시리얼|과자/쿠키/파이|파이/케이크류": pie_cake
