# 코스트코 카테고리 매핑
#
# 키 형식: URL 경로에서 상품명 세그먼트를 제거한 3단계 slug 경로.
#   원본 URL 예: /BeautyHouseholdPersonal-Care/BathBodyOral-Care/Body-LotionBody-Cream/ProductName/p/123
#   키:        "BeautyHouseholdPersonal-Care/BathBodyOral-Care/Body-LotionBody-Cream"
#
# 정규화 규칙 (변환기 내부 처리):
#   1. 앞뒤 "/" 제거
#   2. "/p/" 이후 상품명 세그먼트 제거 → 카테고리 3단계만 추출
#   3. 소문자 변환 없이 원문 slug 유지 (CamelCase 그대로 키 사용)
#   4. 합성어 내 "-"는 유지 (예: "Body-LotionBody-Cream")
#
# 미매핑 raw → reason="UNMAPPED_NEW_CATEGORY"

mappings:

  # 1) 바디/핸드케어 (바디크림)
  # fixture: Bioderma Atoderm Ultra Cream 500ml x 2
  "BeautyHouseholdPersonal-Care/BathBodyOral-Care/Body-LotionBody-Cream": body_hand_care

  # 2) 비타민
  # fixture: Daewoong Pharm Impactamune 84ct (멀티비타민)
  "HealthSupplement/VitaminMineral/Multi-Vitamin": vitamin

  # 3) 운반용품 (핸드트럭)
  # fixture: Stanley Folding Hand Truck 2-IN-1
  # 코스트코 Building-Materials에 핸드트럭이 분류됨 → internal: moving_equipment
  "HardwareAutomotive/Power-ToolsWork-Equipment/Building-Materials": moving_equipment

  # 4) 화장지
  # fixture: Kleenex Pure Soft Mega Rolls Bath Tissue 40m x 60 (화장지)
  # fixture: Kleenex Deco Soft Bath Tissue 40m x 30roll x 2 (화장지)
  "BeautyHouseholdPersonal-Care/BathFacial-Tissue/BathFacial-Tissue": bath_tissue
