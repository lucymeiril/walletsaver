# 롯데마트 카테고리 매핑
#
# 키 형식: categoryPath 배열을 "/"로 join
#   예: ["정육ㆍ계란", "계란ㆍ메추리알", "일반란"] → "정육ㆍ계란/계란ㆍ메추리알/일반란"
#
# "ㆍ" 구분자 정책:
#   롯데마트는 같은 계층에 속하는 여러 카테고리를 "ㆍ"로 묶어 표기함.
#   예: "계란ㆍ메추리알" = "계란 OR 메추리알" 두 항목의 합성 표시.
#   변환기에서는 이를 단일 토큰으로 취급(분리하지 않음)하며,
#   internal 카테고리는 해당 토큰 전체가 포함되는 가장 적합한 노드로 매핑.
#   향후 "메추리알"에 별도 노드가 필요한 경우 별도 키로 추가.
#
# 미매핑 raw → reason="UNMAPPED_NEW_CATEGORY"

mappings:

  # 1) 계란
  # fixture: [농할할인가 6,990원] 행복생생란 (특란, 30입) (1.8KG)
  "정육ㆍ계란/계란ㆍ메추리알/일반란": egg

  # 2) 키위
  # fixture: 제스프리 골드키위 (EA)
  "과일/파인애플ㆍ키위/키위ㆍ참다래": kiwi

  # 3) 파프리카
  # fixture: 국내산 파프리카 (개)
  "채소/고추ㆍ파프리카ㆍ피망/파프리카": paprika

  # 4) 두부
  # fixture: 풀무원 국산 부침두부 (340G)
  # 롯데마트에서 두부는 "채소" 대분류 하위 — internal은 processed_food > tofu_soy > tofu
  "채소/두부ㆍ나또ㆍ콩나물ㆍ숙주나물/두부": tofu

  # 5) 밀키트 (중식)
  # fixture: CJ 고메 중화짬뽕 (2인분) (652G)
  "간편식ㆍ밀키트/밀키트/중식": meal_kit
