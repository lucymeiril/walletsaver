  - id: health_supplement
    name_kr: 건강기능식품
    name_en: Health Supplement
    parent_id: beauty_health
    display_order: 2
    default_unit_kind: EACH

  # L3: 비타민 (코스트코: Multi-Vitamin)
  - id: vitamin
    name_kr: 비타민
    name_en: Vitamin
    parent_id: health_supplement
