# WalletSavior 통합 카테고리 트리
#
# 설계 원칙:
#   - 최대 4단계 깊이 (L1 대분류 → L2 중분류 → L3 소분류 → L4 세분류)
#   - 4사 fixture에 등장한 상품만 시드로 포함 (최소 트리 원칙)
#   - id는 stable snake_case 영문 slug — 코드 변경 없이 추가 가능
#   - default_unit_kind: 가격 비교 시 단위 정규화에 사용
#     GRAM_PER_100G / EACH / ROLL / ML_PER_100ML / SET
#
# 향후 라이브 데이터에서 새 카테고리 발견 시 여기에만 추가하면 됨.
# 변환기(category_mapper.py)와 매핑 테이블(category_mappings/*.yaml)은
# 이 파일을 참조하며, id 변경 시 매핑 테이블도 함께 수정 필요.

nodes:

  # ───────────────────────────────────────────────
  # L1: 신선식품
  # ───────────────────────────────────────────────
  - id: fresh_food
    name_kr: 신선식품
    name_en: Fresh Food
    parent_id: null
    display_order: 1
    default_unit_kind: GRAM_PER_100G

  # L2: 채소
  - id: vegetable
    name_kr: 채소
    name_en: Vegetable
    parent_id: fresh_food
    display_order: 1
    default_unit_kind: GRAM_PER_100G

  # L3: 엽채류 (양배추 등 잎채소)
  - id: leaf_vegetable
    name_kr: 엽채류
    name_en: Leaf Vegetable
    parent_id: vegetable
    display_order: 1
    default_unit_kind: GRAM_PER_100G

  # L4: 양배추
  - id: cabbage
    name_kr: 양배추
    name_en: Cabbage
    parent_id: leaf_vegetable
    display_order: 1
    default_unit_kind: GRAM_PER_100G

  # L3: 근채류 (감자 등 뿌리채소)
  - id: root_vegetable
    name_kr: 근채류
    name_en: Root Vegetable
    parent_id: vegetable
    display_order: 2
    default_unit_kind: GRAM_PER_100G

  # L4: 감자
  - id: potato
    name_kr: 감자
    name_en: Potato
    parent_id: root_vegetable
    display_order: 1
    default_unit_kind: GRAM_PER_100G

  # L3: 과채류 (파프리카, 고추 등 열매채소)
  - id: fruit_vegetable
    name_kr: 과채류
    name_en: Fruit Vegetable
    parent_id: vegetable
    display_order: 3
    default_unit_kind: EACH

  # L4: 파프리카
  - id: paprika
    name_kr: 파프리카
    name_en: Paprika
    parent_id: fruit_vegetable
    display_order: 1
    default_unit_kind: EACH

  # L2: 과일
  - id: fruit
    name_kr: 과일
    name_en: Fruit
    parent_id: fresh_food
    display_order: 2
    default_unit_kind: EACH

  # L3: 열대/아열대과일 (키위, 파인애플 등)
  - id: tropical_fruit
    name_kr: 열대과일
    name_en: Tropical Fruit
    parent_id: fruit
    display_order: 1
    default_unit_kind: EACH

  # L4: 키위
  - id: kiwi
    name_kr: 키위
    name_en: Kiwi
    parent_id: tropical_fruit
    display_order: 1
    default_unit_kind: EACH

  # L2: 곡류
  - id: grain
    name_kr: 곡류
    name_en: Grain
    parent_id: fresh_food
    display_order: 3
    default_unit_kind: GRAM_PER_100G

  # L3: 쌀
  - id: rice
    name_kr: 쌀
    name_en: Rice
    parent_id: grain
    display_order: 1
    default_unit_kind: GRAM_PER_100G

  # L2: 정육/계란 (홈플러스·롯데마트 분류 기준 병합)
  - id: meat_egg
    name_kr: 정육·계란
    name_en: Meat & Egg
    parent_id: fresh_food
    display_order: 4
    default_unit_kind: GRAM_PER_100G

  # L3: 소고기 (국내산)
  - id: beef
    name_kr: 소고기
