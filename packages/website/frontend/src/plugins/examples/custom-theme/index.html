<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커스텀 테마</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="color"] {
      width: 36px;
      height: 36px;
      border: 2px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      padding: 2px;
    }
    .color-value {
      font-size: 12px;
      color: #64748b;
      font-family: monospace;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }
    .range-value {
      font-size: 12px;
      color: #38bdf8;
      text-align: right;
    }
    .preview {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      transition: all 0.3s ease;
    }
    .preview h3 {
      margin-bottom: 8px;
    }
    .preview p {
      line-height: 1.5;
    }
    .btn-apply {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #020617;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-apply:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="header">🎨 커스텀 테마</div>
  <div class="controls">
    <div class="control-group">
      <label>메인 색상</label>
      <div class="color-row">
        <input type="color" id="primaryColor" value="#38bdf8">
        <span class="color-value" id="primaryValue">#38bdf8</span>
      </div>
    </div>
    <div class="control-group">
      <label>배경 색상</label>
      <div class="color-row">
        <input type="color" id="bgColor" value="#0f172a">
        <span class="color-value" id="bgValue">#0f172a</span>
      </div>
    </div>
    <div class="control-group">
      <label>글꼴 크기</label>
      <input type="range" id="fontSize" min="12" max="24" value="16">
      <div class="range-value" id="fontSizeValue">16px</div>
    </div>
    <div class="control-group">
      <label>둥근 모서리</label>
      <input type="range" id="borderRadius" min="0" max="24" value="12">
      <div class="range-value" id="borderRadiusValue">12px</div>
    </div>
  </div>

  <div class="preview" id="preview">
    <h3>미리보기</h3>
    <p>이 영역에서 변경 사항을 미리 확인할 수 있습니다.</p>
  </div>

  <button class="btn-apply" id="applyBtn">테마 적용</button>

  <script>
    const preview = document.getElementById('preview');
    const primaryColor = document.getElementById('primaryColor');
    const bgColor = document.getElementById('bgColor');
    const fontSize = document.getElementById('fontSize');
    const borderRadius = document.getElementById('borderRadius');

    function updatePreview() {
      preview.style.backgroundColor = bgColor.value;
      preview.style.borderColor = primaryColor.value;
      preview.style.fontSize = fontSize.value + 'px';
      preview.style.borderRadius = borderRadius.value + 'px';
      preview.querySelector('h3').style.color = primaryColor.value;

      document.getElementById('primaryValue').textContent = primaryColor.value;
      document.getElementById('bgValue').textContent = bgColor.value;
      document.getElementById('fontSizeValue').textContent = fontSize.value + 'px';
      document.getElementById('borderRadiusValue').textContent = borderRadius.value + 'px';
    }

    primaryColor.addEventListener('input', updatePreview);
    bgColor.addEventListener('input', updatePreview);
    fontSize.addEventListener('input', updatePreview);
    borderRadius.addEventListener('input', updatePreview);

    document.getElementById('applyBtn').addEventListener('click', () => {
      // 호스트에 테마 변경 요청
      if (window.WalletSavior) {
        window.WalletSavior.showToast('테마가 적용되었습니다!', 'success');
      } else {
        alert('테마가 적용되었습니다!');
      }
    });
  </script>
</body>
</html>
