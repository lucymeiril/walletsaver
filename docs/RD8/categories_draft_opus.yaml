# WalletSavior 통합 카테고리 트리 — RD8 1패스 (Opus 초안)
#
# 설계 원칙 (사용자 명시 요약):
#   1. 마트 4사(이마트·홈플러스·롯데마트·코스트코) 크롤 상품군 사전 포괄
#   2. 큰 카테고리 → 드릴다운 (평탄화 금지)
#   3. id 형식: domain.l1.l2.l3 (영문, 점 구분)
#   4. 핫딜 비교 단위 — 같은 leaf 안에서 가격 비교 가능 (예: 코카콜라 1.5L vs 펩시 1.5L)
#   5. 마트별 명칭 충돌은 매핑 테이블이 흡수, 본 트리는 사용자 관점 단일
#   6. leaf 노드에 keyword_seeds 5~15개 (검색·NLP 분류기 시드)
#
# unit_kind_default 값:
#   weight   — g/kg 단위로 단가 비교 (정육·곡류·과일 등 무게물)
#   volume   — ml/L 단위 단가 비교 (음료·식용유·세제)
#   count    — 개/입/매 단위 (계란·롤·매수)
#   pack     — 봉/팩/세트 단가 (라면 봉, 마스크 세트)
#
# parent: null 이면 L1 도메인 루트.
# 트리 깊이: 최대 4단계 (domain → l1 → l2 → l3). 실제 leaf 는 보통 3단계.

categories:

